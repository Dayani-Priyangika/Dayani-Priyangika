<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank You - BolanaEducation Center</title>
  <style>
    body {
      background: #003366;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .thank-you-container {
      background: #00509e;
      padding: 40px 60px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      margin-bottom: 16px;
      font-size: 2.5rem;
      letter-spacing: 2px;
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    a.button {
      background-color: #f0a500;
      color: #003366;
      text-decoration: none;
      padding: 12px 30px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1rem;
      transition: background-color 0.3s ease;
      display: inline-block;
    }
    a.button:hover {
      background-color: #cf8500;
    }
  </style>
</head>
<body>
  <div class="thank-you-container">
    <h1>Thank You!</h1>
    <p>Your message has been sent successfully.<br>We will get back to you soon.</p>
    <a href="index.html" class="button">Back to Home</a>
  </div>
</body>
</html>
