<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Bolana Education Center</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      height: 100%;
      width: 100%;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    /* Left panel */
    .left-panel {
      flex: 1;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .logo {
      width: 150px;
      margin-bottom: 20px;
    }

    .left-panel h2 {
      color: #1d2d59;
      font-size: 24px;
    }

    /* Right panel */
    .right-panel {
      flex: 1;
      background-color: #1d2d59;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: transparent;
      padding: 40px;
      width: 100%;
      max-width: 350px;
    }

    .login-box h2 {
      color: #fff;
      margin-bottom: 30px;
      font-size: 22px;
      font-weight: bold;
    }

    form label {
      color: #fff;
      font-size: 14px;
      display: block;
      margin-bottom: 5px;
    }

    form input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      background-color: #2a3e75;
      color: #fff;
      border-radius: 4px;
      font-size: 14px;
      outline: none;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background-color: #2196f3;
      color: #fff;
      font-weight: bold;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      transition: 0.3s;
    }

    .login-btn:hover {
      background-color: #0b7dda;
    }

    .access-link {
      text-align: right;
      margin-top: 10px;
    }

    .access-link a {
      color: #8cbff4;
      text-decoration: none;
      font-size: 13px;
    }

    .access-link a:hover {
      text-decoration: underline;
    }

    .error {
      color: red;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="left-panel">
      <img src="images/h.png" alt="Logo" class="logo">
      <h2>Bolana Education Center</h2>
    </div>

    <div class="right-panel">
      <div class="login-box">
        <h2>Login into your account</h2>
        <!-- PHP login form -->
        <form action="login.php" method="POST">
          <label for="username">Username *</label>
          <input type="text" id="username" name="username" placeholder="Username" required>

          <label for="password">Password *</label>
          <input type="password" id="password" name="password" placeholder="Password" required>

          <button type="submit" class="login-btn">LOG IN</button>

          <div class="access-link">
            <a href="contact.html">I CAN'T ACCESS MY ACCOUNT</a>
          </div>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
